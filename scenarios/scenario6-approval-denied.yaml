name: scenario6-approval-denied
description: >
  Repeated DQ finding — agent proposes a bigger fix. Human declines the
  request via the Adaptive Card. Triage does NOT dispatch, does NOT
  charge the remediation budget, and reports "Human declined the
  proposed bigger fix — no action taken." Silence never reads as
  consent, and neither does "no".
payload:
  report:       "Orders Fact"
  workspace_id: "11111111-1111-1111-1111-111111111111"
  dataset_id:   "22222222-2222-2222-2222-222222222222"
  error:        "Persistent duplicate rows on order_id; auto-flag did not clear."
  source_table: "dbo.source_orders"
  key_column:   "order_id"
  request_bigger_fix: true
auto_approve:
  decision: denied
  actor:    "kendra@sm-energy.demo"
expect:
  final_action:   approval_denied
  tool_sequence:
    - check_or_open_incident
    - lookup_playbooks
    - dq-agent
    - request_approval
    - post_teams_message
    - check_approval
    - close_incident
    - post_teams_message
  teams_body_contains:
    - "Human declined the proposed bigger fix"
    - "no action taken"
  demo_events_stages:
    - approval_requested
    - approval_denied
    - teams_posted
  approvals_final_decision: denied
