name: scenario2b-known-issue
description: >
  The same failure signature has been seen before. The controller
  suppresses the second alert; Triage reports the count and stops.
  Sequenced immediately after scenario1-transient so the incident row
  from scenario 1 provides the "first occurrence" reference.
depends_on: scenario1-transient
payload:
  report:       "Weekly Sales Summary"
  workspace_id: "11111111-1111-1111-1111-111111111111"
  dataset_id:   "22222222-2222-2222-2222-222222222222"
  error:        "The underlying connection was closed unexpectedly (transient)."
  source_table: "dbo.source_orders"
  key_column:   "line_id"
expect:
  final_action:   duplicate_suppressed
  tool_sequence:
    - check_or_open_incident
    - close_incident
    - post_teams_message
  teams_body_contains:
    - "Duplicate alert suppressed"
    - "occurrence 2"
  demo_events_stages:
    - email_received
    - duplicate_suppressed
    - teams_posted
  incidents_min_occurrence: 2
