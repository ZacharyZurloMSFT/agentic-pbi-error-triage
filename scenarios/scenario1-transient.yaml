# Scenario 1 — Transient failure, happy path.
# DQ returns clean. Triage refreshes the semantic model. Teams reports resolved.
name: scenario1-transient
description: >
  A transient network hiccup causes a refresh failure. DQ finds no
  duplicates. Triage retries the refresh once (bounded) and the incident
  closes as resolved.
payload:
  report:       "Weekly Sales Summary"
  workspace_id: "11111111-1111-1111-1111-111111111111"
  dataset_id:   "22222222-2222-2222-2222-222222222222"
  error:        "The underlying connection was closed unexpectedly (transient)."
  source_table: "dbo.source_orders"
  key_column:   "line_id"
expect:
  final_action:   resolved
  tool_sequence:
    - check_or_open_incident
    - lookup_playbooks
    - dq-agent
    - policy_charge
    - refresh_pbi_dataset
    - close_incident
    - post_teams_message
  teams_body_contains:
    - "Weekly Sales Summary"
    - "refresh"
  demo_events_stages:
    - email_received
    - incident_opened
    - playbook_retrieved
    - dq_delegated
    - dq_verdict
    - tier1_classified
    - refresh_triggered
    - teams_posted
