name: scenario3-policy-block
description: >
  Agent tries to remediate twice in the same run. The per-run remediation
  budget is 1. Second policy_charge returns allowed=false with
  reason=budget_exhausted. The refusal is DATA, not a crash — Triage
  escalates to a human via Teams.
payload:
  report:       "Weekly Sales Summary"
  workspace_id: "11111111-1111-1111-1111-111111111111"
  dataset_id:   "22222222-2222-2222-2222-222222222222"
  error:        "The underlying connection was closed unexpectedly."
  source_table: "dbo.source_orders"
  key_column:   "line_id"
  force_second_refresh: true
expect:
  final_action:   policy_denied
  tool_sequence:
    - check_or_open_incident
    - lookup_playbooks
    - dq-agent
    - policy_charge
    - refresh_pbi_dataset
    - policy_charge
    - close_incident
    - post_teams_message
  teams_body_contains:
    - "Policy refused"
    - "budget_exhausted"
  demo_events_stages:
    - refresh_triggered
    - policy_denied
    - teams_posted
  policy_ledger_min_denied: 1
