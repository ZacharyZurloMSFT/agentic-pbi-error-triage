name: scenario2-data-quality
description: >
  A refresh error masks a data-quality problem: duplicates on the declared
  key. DQ writes flag rows before returning the verdict; Triage never
  refreshes and never proposes a bigger fix in this scenario.
payload:
  report:       "Orders Fact"
  workspace_id: "11111111-1111-1111-1111-111111111111"
  dataset_id:   "22222222-2222-2222-2222-222222222222"
  error:        "Duplicate rows on the declared primary key."
  source_table: "dbo.source_orders"
  key_column:   "order_id"
expect:
  final_action:   flagged_data_quality
  tool_sequence:
    - check_or_open_incident
    - lookup_playbooks
    - dq-agent
    - close_incident
    - post_teams_message
  teams_body_contains:
    - "Table dbo.source_orders contains"
    - "duplicates on key order_id"
  demo_events_stages:
    - email_received
    - incident_opened
    - playbook_retrieved
    - dq_delegated
    - dq_verdict
    - dq_flagged
    - teams_posted
  dq_flags_rows_min: 1
