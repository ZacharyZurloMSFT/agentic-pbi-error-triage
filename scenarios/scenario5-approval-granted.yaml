name: scenario5-approval-granted
description: >
  Repeated DQ finding — agent proposes a bigger fix (apply_bigger_fix).
  The controller returns requires_approval; Triage posts an Adaptive Card
  with Approve/Deny buttons; a human clicks Approve; Triage dispatches
  the action once. This is the branch that makes the demo generalise.
payload:
  report:       "Orders Fact"
  workspace_id: "11111111-1111-1111-1111-111111111111"
  dataset_id:   "22222222-2222-2222-2222-222222222222"
  error:        "Persistent duplicate rows on order_id; auto-flag did not clear."
  source_table: "dbo.source_orders"
  key_column:   "order_id"
  request_bigger_fix: true
auto_approve:
  decision: granted
  actor:    "kendra@sm-energy.demo"
expect:
  final_action:   resolved
  tool_sequence:
    - check_or_open_incident
    - lookup_playbooks
    - dq-agent
    - request_approval
    - post_teams_message
    - check_approval
    - policy_charge
    - close_incident
    - post_teams_message
  teams_body_contains:
    - "Approval requested: apply_bigger_fix"
    - "Approved"
  demo_events_stages:
    - approval_requested
    - approval_granted
    - teams_posted
  approvals_final_decision: granted
