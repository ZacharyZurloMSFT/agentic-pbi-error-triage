openapi: "3.0.3"
info:
  title: SME Playbook Retrieval
  version: "1.0.0"
  description: >
    Retrieve up to 3 documented failure-mode playbooks whose triggers match
    a raw error string. Each entry states whether a retry is USEFUL — the
    part that changes the decision. Ported from the reference repo's
    knowledge/playbooks.py; sources are public Microsoft Learn pages only.
servers:
  - url: https://func-sme.azurewebsites.net
paths:
  /api/playbooks/lookup:
    post:
      operationId: lookup_playbooks
      summary: Retrieved knowledge lookup for the current error.
      description: >
        Triage calls this once per run immediately after
        incidents/check_or_open. If any hit has retry_useful=false, treat
        the failure as non-transient even when a naive read of the error
        would suggest retrying.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaybookRequest"
      responses:
        "200":
          description: Zero or more matching playbooks (capped at 3).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybookResult"
components:
  schemas:
    PlaybookRequest:
      type: object
      required: [error_text]
      properties:
        error_text:
          type: string
          description: The raw error message from the incoming email.
        limit:
          type: integer
          description: Max hits to return (1-3). Default 3.
          minimum: 1
          maximum: 3
    PlaybookResult:
      type: object
      properties:
        hits:
          type: array
          items:
            type: object
            properties:
              id:               { type: string }
              title:            { type: string }
              retry_useful:     { type: boolean }
              summary:          { type: string }
              source_url:       { type: string }
              preferred_action: { type: string, nullable: true }
        checked_at: { type: string, format: date-time }
