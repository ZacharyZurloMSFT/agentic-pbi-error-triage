openapi: "3.0.3"
info:
  title: SME Prompt Hash Lookup
  version: "1.0.0"
  description: >
    Return the SHA-256 prefix of the currently deployed prompt for an
    agent. Agents call this once at the start of every run and stamp the
    returned hash onto every log_event row so a prompt change is
    traceable in run history. Fails soft — a missing row returns an
    empty hash rather than breaking the run.
servers:
  - url: https://func-sme.azurewebsites.net
paths:
  /api/prompts/current:
    post:
      operationId: get_prompt_hash
      summary: Return the latest deployed prompt hash for an agent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent]
              properties:
                agent:
                  type: string
                  description: The agent name (matches definitions/*.yaml).
                  enum: [triage-agent, dq-agent]
      responses:
        "200":
          description: Latest hash or empty string when none has been registered yet.
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent:        { type: string }
                  prompt_hash:  { type: string, description: "16-char hex prefix or empty." }
                  deployed_at:  { type: string, format: date-time, nullable: true }
